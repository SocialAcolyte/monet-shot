# Keeps the three Monet Shots in step (docs/PARITY.md §6).
#   macOS:   the Swift app builds, MonetShotChecks pass, fixtures are fresh
#            (regenerated from the Swift Kit, they must equal what's committed:
#            a diff means one side changed alone).
#   Ubuntu:  cargo test, Tauri build (AppImage + deb).
#   Arch:    cargo test, PKGBUILD (Omarchy).
#   Windows: cargo test, Tauri build (NSIS, ffmpeg sidecar); windows-run runs
#            the app on the VM's desktop (record, editor, preview, export).
# And one VERSION everywhere.
name: desktop

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One version everywhere
        run: desktop/tools/stamp-version.sh --check

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the Mac app
        run: swift build -c release
      - name: MonetShotChecks
        run: swift run MonetShotChecks
      - name: Fixtures are fresh
        run: |
          shared/tools/fixtures.sh
          # Fixtures built from Mac work that isn't committed yet are listed in
          # shared/PENDING and skipped here until that work lands.
          skip=$(grep -v '^#' shared/PENDING | awk 'NF {printf ":(exclude)shared/fixtures/%s ", $1}')
          # Data must match exactly; rendered frames within a tolerance,
          # since CoreImage differs by a hair between macOS versions.
          git diff --exit-code -- shared/fixtures $skip ':(exclude)shared/fixtures/**/*.png' || {
            echo "::error::shared/fixtures changed when regenerated from the Swift Kit: port the change to desktop/ (or commit the new fixtures with it)"
            exit 1
          }
          bad=0
          for f in $(git diff --name-only -- 'shared/fixtures/**/*.png'); do
            git show "HEAD:$f" > /tmp/committed.png
            echo -n "$f: "
            swift shared/tools/pngdiff.swift /tmp/committed.png "$f" || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::a reference frame changed beyond tolerance when regenerated"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: Core and capture (macos-dev) tests
        working-directory: desktop
        run: cargo test -p monetshot-core -p monetshot-capture

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libpipewire-0.3-dev ffmpeg \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/app/package-lock.json }
      - name: cargo test
        working-directory: desktop
        run: cargo test --workspace
      - name: wasm-bindgen CLI (core-wasm)
        run: desktop/tools/install-wasm-bindgen.sh
      - name: Tauri build (AppImage + deb)
        working-directory: desktop/app
        run: |
          npm ci
          npx tauri build --config ../packaging/linux/tauri.linux.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/deb/*.deb

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: |
          # System rust (not rustup), so makepkg's unprivileged user has it too.
          pacman -Syu --noconfirm --needed git rust rust-wasm clang pkgconf nodejs npm namcap \
            pipewire ffmpeg webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg openssl \
            gst-plugins-base gst-plugins-good gst-libav xdg-desktop-portal xdg-desktop-portal-hyprland
      - uses: actions/checkout@v4
      - name: cargo test
        working-directory: desktop
        run: cargo test --workspace
      - name: makepkg (Omarchy package)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd desktop/packaging/omarchy
          sudo -u builder env HOME=/home/builder makepkg --noconfirm --nodeps -f
          namcap ./*.pkg.tar.zst || true
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: desktop/packaging/omarchy/*.pkg.tar.zst

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/app/package-lock.json }
      - name: ffmpeg sidecar
        run: desktop/packaging/windows/fetch-ffmpeg.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo test
        working-directory: desktop
        env:
          MONETSHOT_FFMPEG: ${{ github.workspace }}/desktop/packaging/windows/bin/ffmpeg-x86_64-pc-windows-msvc.exe
        run: cargo test --workspace
      - name: wasm-bindgen CLI (core-wasm)
        run: desktop/tools/install-wasm-bindgen.sh
      - name: Tauri build (NSIS)
        working-directory: desktop/app
        run: |
          npm ci
          npx tauri build --config ../packaging/windows/tauri.windows.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/bundle/nsis/*.exe

  # The Windows build run on the VM's real desktop (WebView2, Windows.Graphics
  # Capture): records a take, runs the editor check, compares the preview
  # with the Mac's frames, plays an HEVC take via the H.264 proxy, exports,
  # installs the NSIS build and records with it (pause, protected pill),
  # records a window picked in our picker and stops it by holding the pill.
  # See desktop/tools/windows-run.ps1. Builds its own exes so it runs
  # alongside the `windows` job.
  windows-run:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/app/package-lock.json }
      - name: ffmpeg sidecar
        run: desktop/packaging/windows/fetch-ffmpeg.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: wasm-bindgen CLI (core-wasm)
        run: desktop/tools/install-wasm-bindgen.sh
      - name: Build (release exe + NSIS installer, debug exe, plan_dump)
        working-directory: desktop/app
        run: |
          npm ci
          npx tauri build --bundles nsis --config ../packaging/windows/tauri.windows.conf.json
          cd ..
          cargo build -p monet-shot
          cargo build -p monetshot-core --example plan_dump
      - name: Run on the desktop (record, editor, fixtures, HEVC, export, install, window)
        shell: pwsh
        run: desktop/tools/windows-run.ps1 -Out "$env:RUNNER_TEMP/ms-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-run
          path: ${{ runner.temp }}/ms-run
          if-no-files-found: warn

  # The Linux app under real Hyprland: Omarchy 4's own config (and 3's
  # Waybar), xdg-desktop-portal-hyprland's ScreenCast over PipeWire, Hyprland
  # IPC for the cursor, the pill's window rules, install.sh, SUPER+ALT+R, the
  # editor and an export. Hyprland runs on its DRM backend on a vkms virtual
  # display (llvmpipe) inside an Arch container. See desktop/tools/hypr-run.sh.
  hyprland-run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: vkms + uinput
        run: |
          uname -r
          desktop/tools/hypr-kmod.sh
          ls -l /dev/dri /dev/uinput
      - name: Room for the images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h / | tail -1
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/target
          key: hypr-target-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: hypr-target-
      - name: Hyprland run (images, build, session, checks)
        env:
          TARGET: ${{ runner.temp }}/target
          OUT: ${{ runner.temp }}/omarchy
        run: desktop/tools/hypr-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyprland-run
          path: ${{ runner.temp }}/omarchy
          if-no-files-found: warn
