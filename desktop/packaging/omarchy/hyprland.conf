# Monet Shot on Omarchy 3 (Hyprland 0.53+ rule syntax). Sourced from
# ~/.config/hypr/hyprland.conf by install.sh:
#   source = /usr/share/monet-shot/omarchy/hyprland.conf
# The app's GTK id is "monet-shot"; its windows are told apart by title.

# Home and the editors float (the app sizes and places them).
windowrule = float on, match:class ^(monet-shot)$
windowrule = center on, match:class ^(monet-shot)$, match:title ^(Monet Shot)$

# The record pill: over everything, every workspace, top centre, no animation,
# never focused, kept out of screen sharing (drawn black there).
windowrule = pin on, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$
windowrule = no_anim on, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$
windowrule = border_size 0, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$
windowrule = no_shadow on, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$
windowrule = no_initial_focus on, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$
windowrule = no_screen_share on, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$
windowrule = move ((monitor_w-window_w)*0.5) 40, match:class ^(monet-shot)$, match:title ^(Monet Shot Pill)$

# Record / stop. SUPER ALT R is free in Omarchy's defaults.
bindd = SUPER ALT, R, Monet Shot: record or stop, exec, monet-shot toggle
