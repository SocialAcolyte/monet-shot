[workspace]
resolver = "2"
# Explicit, so a crate folder made before its Cargo.toml never breaks the build.
members = ["crates/core", "crates/core-wasm", "crates/export", "crates/capture", "crates/transcribe", "app/src-tauri"]
exclude = ["target", "tools"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
monetshot-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Dependencies (tiny-skia, image, …) and the pixel-heavy crates are
# optimised even in dev builds, or exports and the preview crawl in `tauri dev`.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.monetshot-core]
opt-level = 2

[profile.dev.package.monetshot-export]
opt-level = 2

[profile.release]
lto = "thin"
